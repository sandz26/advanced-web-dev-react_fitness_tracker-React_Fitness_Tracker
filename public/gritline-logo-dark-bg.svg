<svg viewBox="0 0 420 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Gritline logo, dark background variant" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Gritline logo (dark background)</title>
<desc>Copper rounded square containing a navy ascending line mark, next to the wordmark Gritline in off-white with the final line in copper, for use on dark backgrounds.</desc>
<rect x="0" y="10" width="100" height="100" rx="22" fill="#E67E22"/>
<polyline points="22,78 44,58 60,68 88,32" fill="none" stroke="#1A1A1A" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="88" cy="32" r="7" fill="#1A1A1A"/>
<circle cx="22" cy="78" r="5" fill="#1ABC9C"/>
<text x="128" y="78" font-family="Arial, sans-serif" font-size="52" font-weight="500" fill="#F9F9F9">grit<tspan fill="#E67E22">line</tspan></text>
</svg>
