<svg viewBox="0 0 420 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Gritline logo" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Gritline logo</title>
<desc>Navy rounded square containing a copper ascending line mark, next to the wordmark Gritline in dark navy with the final line in copper.</desc>
