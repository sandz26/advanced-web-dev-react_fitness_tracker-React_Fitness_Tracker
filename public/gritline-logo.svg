<polyline points="22,78 44,58 60,68 88,32" fill="none" stroke="#E67E22" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="88" cy="32" r="7" fill="#E67E22"/>
<circle cx="22" cy="78" r="5" fill="#1ABC9C"/>
<text x="128" y="78" font-family="Arial, sans-serif" font-size="52" font-weight="500" fill="#2C3E50">grit<tspan fill="#E67E22">line</tspan></text>
</svg>
